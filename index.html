<body id="home">
  <!--
    Blocking, must run before first paint to avoid theme FOUC (bug #28).
    Keys/defaults must stay in sync with src/context/ThemeContext.tsx.
  -->
  <script>
    (function () {
      var THEME_NAME_KEY = "rohityadav_483-portfolio-theme-name";
      var THEME_MODE_KEY = "rohityadav_483-portfolio-theme";
      var DEFAULT_THEME = "default";
      var DEFAULT_MODE = "dark";
      var theme = localStorage.getItem(THEME_NAME_KEY) || DEFAULT_THEME;
      var mode = localStorage.getItem(THEME_MODE_KEY);
      mode = mode === "light" || mode === "dark" ? mode : DEFAULT_MODE;
      document.documentElement.className = "theme-" + theme + " " + mode;
    })();
  </script>
